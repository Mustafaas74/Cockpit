<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<meta name="theme-color" content="#000000">
<title>Cockpit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/barlow-semi-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Barlow"; font-weight: 500; font-display: swap;
    src: url("fonts/barlow-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Barlow Semi Condensed"; font-weight: 500; font-display: swap;
    src: url("fonts/barlow-semi-condensed-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Barlow Semi Condensed"; font-weight: 600; font-display: swap;
    src: url("fonts/barlow-semi-condensed-latin-600-normal.woff2") format("woff2"); }

  :root {
    --night: #000000;        /* true black: OLED pixels off */
    --switch: #151618;       /* key surface */
    --switch-edge: #25272b;
    --switch-press: #24262a;
    --bezel: #2e3136;        /* unlit minor ticks, frames */
    --scale: #8b9098;        /* secondary text */
    --dial: #f2f0eb;         /* numerals and symbols */
    --amber: #ff9e2c;        /* instrument backlight */
    --amber-hot: #ffc670;    /* gauge tip */
    --telltale: #4cc870;     /* screen-awake lamp */
    --sans: "Barlow", -apple-system, system-ui, "SF Arabic", "Geeza Pro", sans-serif;
    --narrow: "Barlow Semi Condensed", "Barlow", -apple-system, system-ui, "SF Arabic", sans-serif;
    --gap: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--night); color: var(--dial);
    font-family: var(--sans); overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Binnacle: switch bank | gauge | switch bank ---------- */
  .app {
    height: 100%;
    display: flex; align-items: stretch; gap: var(--gap);
    padding:
      max(env(safe-area-inset-top), 12px)
      max(env(safe-area-inset-right), 14px)
      max(env(safe-area-inset-bottom), 12px)
      max(env(safe-area-inset-left), 14px);
  }
  .bank {
    flex: 1 1 0; min-width: 0;
    display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 10px;
  }

  /* ---------- Switches ---------- */
  .key {
    position: relative; min-width: 0;
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px;
    background: var(--switch); border: 1px solid var(--switch-edge); border-radius: 18px;
    color: var(--dial); text-decoration: none; -webkit-touch-callout: none;
    transition: transform .09s ease, background-color .09s ease;
  }
  .key:active, .key.pressing { transform: scale(0.97); background: var(--switch-press); }
  .key:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .key svg { flex: none; width: clamp(22px, 7.4vh, 30px); height: clamp(22px, 7.4vh, 30px); }
  .key .txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .key .name {
    font-size: clamp(15px, 5.3vh, 21px); line-height: 1.1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .key .sub { font-size: clamp(11px, 3.4vh, 13px); color: var(--scale); line-height: 1.1; }
  .key .sub:empty { display: none; }

  /* Saved-place LED: lit amber when a place is saved, hollow when not */
  .led {
    position: absolute; top: 11px; right: 12px; width: 8px; height: 8px; border-radius: 50%;
    border: 1.5px solid #4a4e55;
  }
  .place.saved .led { border: 0; background: var(--amber); box-shadow: 0 0 6px 1px rgba(255, 158, 44, .55); }

  /* ---------- Gauge ---------- */
  .gauge {
    flex: none; position: relative; height: 100%; aspect-ratio: 1 / 1; max-width: 50vw;
    container-type: size;
  }
  .gauge .dial { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .tick { stroke-linecap: round; }
  .tick.minor { stroke: var(--bezel); stroke-width: 1.5; }
  .tick.major { stroke: #555a62; stroke-width: 2.2; }
  .lit .tick { stroke: var(--amber); opacity: 0; }
  .lit .tick.on { opacity: 1; }
  #tip { stroke: var(--amber-hot); stroke-width: 3; stroke-linecap: round;
         transform-origin: 100px 100px; transition: transform .8s cubic-bezier(.3,.7,.2,1); }
  #tip.instant { transition: none; }

  .face { position: absolute; inset: 0; pointer-events: none; }
  .date {
    position: absolute; left: 0; right: 0; top: 29%; text-align: center;
    font-size: 4.6vh; font-size: 5.1cqmin; color: var(--scale); letter-spacing: .01em;
  }
  .time {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-52%);
    text-align: center; font-family: var(--narrow); font-weight: 600;
    font-size: 24vh; font-size: 27cqmin; line-height: 1; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .lamp {
    position: absolute; left: 0; right: 0; top: 66%;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    font-size: 3.8vh; font-size: 4.2cqmin; color: var(--amber);
  }
  .lamp svg { width: 1.35em; height: 1.35em; }
  .lamp.on { color: var(--telltale); }
  .lamp.on span { display: none; }
  .lamp.na { color: var(--scale); }

  /* Trip readout sits in the gap at the bottom of the 270° scale, like an odometer window */
  .trip {
    position: absolute; left: 50%; top: 84.5%; transform: translateX(-50%);
    display: flex; align-items: baseline; gap: .45em;
    padding: .3em .75em .32em; border: 1px solid var(--bezel); border-radius: 8px;
    font-family: var(--narrow); font-weight: 500; font-size: 4.4vh; font-size: 4.9cqmin;
    color: var(--scale); white-space: nowrap;
  }
  .trip b { color: var(--dial); font-weight: 600; font-variant-numeric: tabular-nums; }
  .trip.pressing { border-color: var(--amber); }

  /* ---------- Place editor ---------- */
  .sheet-wrap {
    position: fixed; inset: 0; z-index: 10; overflow-y: auto;
    background: rgba(0, 0, 0, .78);
    display: flex; justify-content: center; align-items: flex-start;
    padding: max(env(safe-area-inset-top), 12px) 16px 24px;
  }
  .sheet-wrap[hidden] { display: none; }
  .sheet {
    width: min(560px, 100%); margin: 0;
    background: #101113; border: 1px solid var(--switch-edge); border-radius: 22px;
    padding: 16px 18px 18px; display: grid; gap: 12px;
    -webkit-user-select: text; user-select: text;
  }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .sheet h2 { margin: 0; font-family: var(--narrow); font-weight: 600; font-size: 22px; }
  .field { display: grid; gap: 6px; font-size: 14px; color: var(--scale); }
  .field input {
    font: 500 17px var(--sans); color: var(--dial);
    background: #000; border: 1px solid var(--bezel); border-radius: 12px;
    padding: 11px 12px; outline: none; width: 100%;
  }
  .field input:focus { border-color: var(--amber); }
  .field input::placeholder { color: #5b6068; }
  .here { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .status { font-size: 14px; color: var(--scale); }
  .status.ok { color: var(--telltale); }
  .status.err { color: var(--amber); }
  .btn {
    font: 500 16px var(--sans); color: var(--dial); background: var(--switch);
    border: 1px solid var(--switch-edge); border-radius: 12px; padding: 11px 14px;
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  }
  .btn svg { width: 18px; height: 18px; }
  .btn:active { background: var(--switch-press); }
  .btn.primary { background: var(--amber); border-color: var(--amber); color: #1d1205; }
  .btn.primary:active { background: #e98d22; }
  .link { font: 500 16px var(--sans); background: none; border: 0; color: var(--scale); padding: 8px 4px; cursor: pointer; }
  .link.danger { color: #ff8a7a; }
  .sheet-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 2px; }
  .sheet-foot .hint { font-size: 13px; color: #6d727a; }

  /* ---------- Portrait guard ---------- */
  .rotate {
    display: none; position: fixed; inset: 0; background: var(--night);
    flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    color: var(--scale); font-size: 18px; text-align: center; padding: 24px;
  }
  .rotate svg { width: 44px; height: 44px; color: var(--dial); }
  @media (orientation: portrait) {
    .rotate { display: flex; }
    .app { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #tip, .key { transition: none; }
  }
</style>
</head>
<body>
<main class="app" id="app">

  <nav class="bank" aria-label="Navigation">
    <a class="key place" data-slot="0" href="#">
      <span class="led" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V5.5A1.5 1.5 0 0 1 6.5 4h7A1.5 1.5 0 0 1 15 5.5V21"/><path d="M15 10h2.5A1.5 1.5 0 0 1 19 11.5V21"/><path d="M3 21h18"/><path d="M8.5 8h3M8.5 11.5h3M8.5 15h3"/></svg>
      <span class="txt"><span class="name" dir="auto"></span><span class="sub"></span></span>
    </a>
    <a class="key place" data-slot="1" href="#">
      <span class="led" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8.5 7V5.5A1.5 1.5 0 0 1 10 4h4a1.5 1.5 0 0 1 1.5 1.5V7"/><path d="M3 12.5h18"/><path d="M11 12.5v1.5h2v-1.5"/></svg>
      <span class="txt"><span class="name" dir="auto"></span><span class="sub"></span></span>
    </a>
    <a class="key" href="comgooglemaps://" aria-label="Open Google Maps">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
      <span class="txt"><span class="name">Maps</span></span>
    </a>
  </nav>

  <section class="gauge" aria-label="Clock">
    <svg class="dial" viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <filter id="glow" filterUnits="userSpaceOnUse" x="-10" y="-10" width="220" height="220">
          <feGaussianBlur stdDeviation="1.5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path d="M 47.67 152.33 A 74 74 0 1 1 152.33 152.33" fill="none" stroke="#17181b" stroke-width="1"/>
      <g id="scale"></g>
      <g class="lit" id="lit" filter="url(#glow)"></g>
      <line id="tip" x1="100" y1="22" x2="100" y2="1.5" filter="url(#glow)"/>
    </svg>
    <div class="face">
      <div class="date" id="date"></div>
      <div class="time" id="clock">--:--</div>
      <div class="lamp" id="lamp" role="status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
        <span id="lampText"></span>
      </div>
    </div>
    <div class="trip" id="trip" aria-label="Trip time. Hold to reset.">Trip <b id="tripTime">0:00</b></div>
  </section>

  <nav class="bank" aria-label="Apps">
    <a class="key" href="mobilephone://" aria-label="Open Phone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
      <span class="txt"><span class="name">Phone</span></span>
    </a>
    <a class="key" href="whatsapp://" aria-label="Open WhatsApp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4.1A8 8 0 1 1 20 11.5z"/><path d="M9 10.5h6M9 13.5h4"/></svg>
      <span class="txt"><span class="name">WhatsApp</span></span>
    </a>
    <a class="key" href="youtubemusic://" aria-label="Open YouTube Music">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
      <span class="txt"><span class="name">YT Music</span></span>
    </a>
  </nav>
</main>

<div class="sheet-wrap" id="sheet" hidden>
  <form class="sheet" id="sheetForm" novalidate>
    <div class="sheet-head">
      <h2 id="sheetTitle">Set up place</h2>
      <button type="button" class="link" id="sheetCancel">Cancel</button>
    </div>
    <label class="field">Name
      <input id="fName" maxlength="18" autocomplete="off" autocorrect="off" dir="auto">
    </label>
    <div class="here">
      <button type="button" class="btn" id="useHere">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/><circle cx="12" cy="12" r="7"/></svg>
        Use my current location
      </button>
      <span class="status" id="hereStatus">Use this while you're parked there.</span>
    </div>
    <label class="field">Or type an address or place name
      <input id="fAddr" placeholder="King Fahd Rd, Dammam" autocomplete="off" dir="auto">
    </label>
    <div class="sheet-foot">
      <button type="button" class="link danger" id="removePlace">Remove place</button>
      <span class="hint" id="footHint">Hold a place on the dashboard to change it.</span>
      <button type="submit" class="btn primary">Save place</button>
    </div>
  </form>
</div>

<div class="rotate">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M20.5 9.5a7 7 0 0 1 0 5M3.5 9.5a7 7 0 0 0 0 5"/></svg>
  Turn your phone sideways
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ---------- Gauge: 270° scale, one tick per minute of the hour ---------- */
  const SVGNS = 'http://www.w3.org/2000/svg';
  const START = 135, STEP = 270 / 60;          // degrees; 0 min = bottom-left, 60 = bottom-right
  const litTicks = [];
  function tickLine(i, cls) {
    const a = (START + i * STEP) * Math.PI / 180;
    const major = i % 5 === 0;
    const r1 = major ? 85 : 90, r2 = 97;
    const l = document.createElementNS(SVGNS, 'line');
    l.setAttribute('x1', (100 + r1 * Math.cos(a)).toFixed(2));
    l.setAttribute('y1', (100 + r1 * Math.sin(a)).toFixed(2));
    l.setAttribute('x2', (100 + r2 * Math.cos(a)).toFixed(2));
    l.setAttribute('y2', (100 + r2 * Math.sin(a)).toFixed(2));
    l.setAttribute('class', 'tick ' + (major ? 'major' : 'minor') + (cls ? ' ' + cls : ''));
    return l;
  }
  for (let i = 0; i <= 60; i++) {
    $('scale').appendChild(tickLine(i));
    const lit = tickLine(i);
    $('lit').appendChild(lit);
    litTicks.push(lit);
  }
  let shown = -1;
  function setGauge(n, instant) {
    n = Math.max(0, Math.min(60, n));
    const whole = Math.floor(n);
    if (whole !== shown) {
      for (let i = 0; i <= 60; i++) litTicks[i].classList.toggle('on', i <= whole);
      shown = whole;
    }
    const tip = $('tip');
    tip.classList.toggle('instant', !!instant);
    // tip line is drawn pointing straight up (270°); rotate it onto the scale
    tip.style.transform = 'rotate(' + (START + n * STEP - 270) + 'deg)';
  }

  /* ---------- Clock (24-hour, English date) ---------- */
  const dateFmt = new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  let lastMinuteKey = '';
  let sweeping = false;
  function tickClock() {
    const d = new Date();
    const key = d.getHours() + ':' + d.getMinutes();
    if (key === lastMinuteKey) return;
    lastMinuteKey = key;
    $('clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    $('date').textContent = dateFmt.format(d);
    if (!sweeping) setGauge(d.getMinutes(), false);
  }

  /* Startup self-test: the scale lights to full and settles on the current minute, like a cluster at ignition */
  function startupSweep() {
    const target = new Date().getMinutes();
    if (reduceMotion) { setGauge(target, true); return; }
    sweeping = true;
    const up = 650, hold = 140, down = 700, t0 = performance.now();
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    function frame(now) {
      const t = now - t0;
      if (t < up) setGauge(60 * ease(t / up), true);
      else if (t < up + hold) setGauge(60, true);
      else if (t < up + hold + down) setGauge(60 - (60 - target) * ease((t - up - hold) / down), true);
      else { sweeping = false; setGauge(new Date().getMinutes(), true); return; }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* ---------- Trip timer (survives app switching; new trip after 30 min away) ---------- */
  const NEW_TRIP_GAP_MS = 30 * 60 * 1000;
  let tripStart = Number(store.get('tripStart')) || 0;
  const lastSeen = Number(store.get('lastSeen')) || 0;
  function resetTrip() {
    tripStart = Date.now();
    store.set('tripStart', String(tripStart));
    tickTrip();
  }
  function tickTrip() {
    const mins = Math.max(0, Math.floor((Date.now() - tripStart) / 60000));
    $('tripTime').textContent = Math.floor(mins / 60) + ':' + String(mins % 60).padStart(2, '0');
    store.set('lastSeen', String(Date.now()));
  }
  if (!tripStart || Date.now() - lastSeen > NEW_TRIP_GAP_MS) resetTrip();

  /* Long-press helper (used by the trip readout and the place keys) */
  function onHold(el, ms, fn) {
    let timer = null, x = 0, y = 0;
    const cancel = () => { clearTimeout(timer); timer = null; el.classList.remove('pressing'); };
    el.addEventListener('pointerdown', (e) => {
      x = e.clientX; y = e.clientY; el.held = false;
      el.classList.add('pressing');
      timer = setTimeout(() => { timer = null; el.held = true; el.classList.remove('pressing'); fn(); }, ms);
    });
    el.addEventListener('pointermove', (e) => { if (timer && Math.hypot(e.clientX - x, e.clientY - y) > 12) cancel(); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, cancel));
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  onHold($('trip'), 800, resetTrip);

  /* ---------- Places: saved on this phone only ---------- */
  const PLACES_KEY = 'cockpit.places.v1';
  const DEFAULT_NAMES = ['الشقة', 'Work'];
  let places;
  try { places = JSON.parse(store.get(PLACES_KEY)) || []; } catch (e) { places = []; }
  for (let i = 0; i < 2; i++) places[i] = Object.assign({ name: DEFAULT_NAMES[i], dest: '' }, places[i] || {});
  const savePlaces = () => store.set(PLACES_KEY, JSON.stringify(places));

  function mapsUrl(p) {
    const dest = p.kind === 'coords' ? p.dest : encodeURIComponent(p.dest);
    return 'comgooglemaps://?daddr=' + dest + '&directionsmode=driving';
  }
  function renderPlaces() {
    document.querySelectorAll('.place').forEach((el) => {
      const p = places[Number(el.dataset.slot)];
      const saved = !!p.dest;
      el.classList.toggle('saved', saved);
      el.querySelector('.name').textContent = p.name || DEFAULT_NAMES[el.dataset.slot];
      el.querySelector('.sub').textContent = saved ? '' : 'Tap to set';
      el.setAttribute('href', saved ? mapsUrl(p) : '#');
      el.setAttribute('aria-label', saved ? 'Directions to ' + p.name + '. Hold to change.' : 'Set up ' + p.name);
    });
  }
  document.querySelectorAll('.place').forEach((el) => {
    const slot = Number(el.dataset.slot);
    onHold(el, 550, () => openEditor(slot));
    el.addEventListener('click', (e) => {
      if (el.held) { e.preventDefault(); el.held = false; return; }
      if (!places[slot].dest) { e.preventDefault(); openEditor(slot); }
    });
  });

  /* ---------- Place editor ---------- */
  let editing = 0, pendingCoords = '';
  function setStatus(msg, kind) {
    const s = $('hereStatus');
    s.textContent = msg; s.className = 'status' + (kind ? ' ' + kind : '');
  }
  function openEditor(slot) {
    editing = slot;
    const p = places[slot];
    $('sheetTitle').textContent = p.dest ? 'Change place' : 'Set up place';
    $('fName').value = p.name || DEFAULT_NAMES[slot];
    $('fAddr').value = p.kind === 'text' ? p.dest : '';
    pendingCoords = p.kind === 'coords' ? p.dest : '';
    if (pendingCoords) setStatus('Saved spot: ' + pendingCoords, 'ok');
    else setStatus("Use this while you're parked there.");
    $('removePlace').hidden = !p.dest;
    $('footHint').hidden = !!p.dest;
    $('sheet').hidden = false;
  }
  function closeEditor() { $('sheet').hidden = true; document.activeElement && document.activeElement.blur(); }

  $('useHere').addEventListener('click', () => {
    if (!('geolocation' in navigator)) { setStatus("Location isn't available here. Type an address instead.", 'err'); return; }
    setStatus('Finding your location…');
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        pendingCoords = pos.coords.latitude.toFixed(5) + ',' + pos.coords.longitude.toFixed(5);
        $('fAddr').value = '';
        setStatus('Got this spot. Tap Save place to keep it.', 'ok');
      },
      (err) => setStatus(err.code === 1
        ? 'Location is blocked for Cockpit. Allow it in Settings, or type an address.'
        : "Couldn't get your location. Try again or type an address.", 'err'),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });
  $('fAddr').addEventListener('input', () => {
    if ($('fAddr').value.trim() && pendingCoords) { pendingCoords = ''; setStatus("Use this while you're parked there."); }
  });
  $('sheetForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('fName').value.trim() || DEFAULT_NAMES[editing];
    const addr = $('fAddr').value.trim();
    if (addr) places[editing] = { name, dest: addr, kind: 'text' };
    else if (pendingCoords) places[editing] = { name, dest: pendingCoords, kind: 'coords' };
    else { setStatus('Add your current location or an address first.', 'err'); return; }
    savePlaces(); renderPlaces(); closeEditor();
  });
  $('removePlace').addEventListener('click', () => {
    places[editing] = { name: places[editing].name || DEFAULT_NAMES[editing], dest: '' };
    savePlaces(); renderPlaces(); closeEditor();
  });
  $('sheetCancel').addEventListener('click', closeEditor);
  $('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) closeEditor(); });

  /* ---------- Keep the screen awake (Screen Wake Lock) ---------- */
  let lock = null;
  function showLamp(state) {
    $('lamp').className = 'lamp ' + state;
    $('lampText').textContent = state === 'off' ? 'Tap to keep the screen on'
                              : state === 'na' ? "Screen can't stay on here" : '';
    $('lamp').setAttribute('aria-label', state === 'on' ? 'Screen stays on' : $('lampText').textContent);
  }
  async function requestLock() {
    if (!('wakeLock' in navigator)) { showLamp('na'); return; }
    if (lock && !lock.released) { showLamp('on'); return; }
    try {
      lock = await navigator.wakeLock.request('screen');
      showLamp('on');
      lock.addEventListener('release', () => { if (document.visibilityState === 'visible') showLamp('off'); });
    } catch (e) { showLamp('off'); }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { lastMinuteKey = ''; tickClock(); tickTrip(); requestLock(); }
  });
  document.addEventListener('touchend', requestLock, { passive: true });
  document.addEventListener('click', requestLock);

  /* ---------- Start ---------- */
  renderPlaces();
  tickClock(); tickTrip(); requestLock();
  startupSweep();
  setInterval(tickClock, 1000);
  setInterval(tickTrip, 15000);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
