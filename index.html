<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<meta name="theme-color" content="#000000">
<title>Cockpit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #000;
    --panel: #121212;
    --line: #262626;
    --text: #f2f2f2;
    --dim: #9a9a9a;
    --faint: #5c5c5c;
    --maps-bg: #0e2a1b;
    --maps-line: #1f5a3a;
    --maps-fg: #6fd39b;
    --gap: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .app {
    height: 100%;
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: var(--gap);
    padding:
      max(env(safe-area-inset-top), 14px)
      max(env(safe-area-inset-right), 14px)
      max(env(safe-area-inset-bottom), 14px)
      max(env(safe-area-inset-left), 14px);
  }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
    min-width: 0; min-height: 0;
  }
  .left {
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 6%;
  }
  .clock {
    font-size: min(24vh, 13vw); font-weight: 600; line-height: 0.95;
    letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
  }
  .date { font-size: min(5.2vh, 3vw); color: var(--dim); margin-top: 1.6vh; }
  .meta {
    display: flex; align-items: center; gap: 22px; margin-top: 4.5vh;
    font-size: min(4.6vh, 2.6vw); color: var(--dim);
  }
  .trip { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
  .trip b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .wake { display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
  .wake.on .dot { background: #4cd07d; }
  .wake.off { color: #e0a24a; }
  .wake.off .dot { background: #e0a24a; }
  .grid {
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: var(--gap); min-height: 0;
  }
  .tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.6vh; text-decoration: none; color: var(--text);
    font-size: min(5vh, 2.8vw); font-weight: 500;
    transition: transform .08s ease, background .08s ease;
  }
  .tile:active { transform: scale(0.96); background: #1d1d1d; }
  .tile svg { width: min(13vh, 7vw); height: min(13vh, 7vw); }
  .tile.maps { background: var(--maps-bg); border-color: var(--maps-line); color: #d4f2e2; }
  .tile.maps:active { background: #133523; }
  .rotate {
    display: none; position: fixed; inset: 0; background: var(--bg);
    align-items: center; justify-content: center; text-align: center;
    color: var(--dim); font-size: 18px; padding: 24px;
  }
  @media (orientation: portrait) {
    .rotate { display: flex; }
    .app { display: none; }
  }
</style>
</head>
<body>
<main class="app" id="app">
  <section class="panel left">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
    <div class="meta">
      <div class="trip" id="trip" title="Long-press to reset">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M10 2h4"/></svg>
        Trip <b id="tripTime">0:00</b>
      </div>
      <div class="wake" id="wake"><span class="dot"></span><span id="wakeText">Screen</span></div>
    </div>
  </section>

  <nav class="grid">
    <a class="panel tile maps" href="comgooglemaps://" aria-label="Open Google Maps">
      <svg viewBox="0 0 24 24" fill="none" stroke="#6fd39b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
      Maps
    </a>
    <a class="panel tile" href="mobilephone://" aria-label="Open Phone">
      <svg viewBox="0 0 24 24" fill="none" stroke="#7fb2ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
      Phone
    </a>
    <a class="panel tile" href="whatsapp://" aria-label="Open WhatsApp">
      <svg viewBox="0 0 24 24" fill="none" stroke="#5fd38a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20l1.3-3.9A8.5 8.5 0 1 1 7.9 19.7z"/><path d="M8.5 10.5h7M8.5 13.5h4.5"/></svg>
      WhatsApp
    </a>
    <a class="panel tile" href="youtubemusic://" aria-label="Open YouTube Music">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ff7a7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></svg>
      YT Music
    </a>
  </nav>
</main>

<div class="rotate">Turn your phone sideways to use Cockpit</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  /* ---------- Clock (24-hour, English date) ---------- */
  const dateFmt = new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  function tickClock() {
    const d = new Date();
    $('clock').textContent =
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    $('date').textContent = dateFmt.format(d);
  }

  /* ---------- Trip timer (survives app switching / reloads) ---------- */
  const NEW_TRIP_GAP_MS = 30 * 60 * 1000; // away > 30 min = new trip
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let tripStart = Number(store.get('tripStart')) || 0;
  const lastSeen = Number(store.get('lastSeen')) || 0;
  if (!tripStart || Date.now() - lastSeen > NEW_TRIP_GAP_MS) resetTrip();

  function resetTrip() {
    tripStart = Date.now();
    store.set('tripStart', String(tripStart));
    tickTrip();
  }
  function tickTrip() {
    const mins = Math.max(0, Math.floor((Date.now() - tripStart) / 60000));
    $('tripTime').textContent = Math.floor(mins / 60) + ':' + String(mins % 60).padStart(2, '0');
    store.set('lastSeen', String(Date.now()));
  }
  // Long-press the trip timer (0.8 s) to reset it
  let pressTimer = null;
  $('trip').addEventListener('touchstart', () => {
    pressTimer = setTimeout(() => { resetTrip(); if (navigator.vibrate) navigator.vibrate(30); }, 800);
  }, { passive: true });
  ['touchend', 'touchcancel', 'touchmove'].forEach(ev =>
    $('trip').addEventListener(ev, () => clearTimeout(pressTimer), { passive: true }));

  /* ---------- Keep screen awake (Screen Wake Lock API) ---------- */
  let lock = null;
  function showWake(state) {
    const el = $('wake'), txt = $('wakeText');
    el.className = 'wake ' + state;
    txt.textContent = state === 'on' ? 'Screen on'
                    : state === 'off' ? 'Tap to keep screen on'
                    : 'Screen lock not supported';
  }
  async function requestLock() {
    if (!('wakeLock' in navigator)) { showWake('na'); return; }
    if (lock && !lock.released) { showWake('on'); return; }
    try {
      lock = await navigator.wakeLock.request('screen');
      showWake('on');
      lock.addEventListener('release', () => { if (document.visibilityState === 'visible') showWake('off'); });
    } catch (e) {
      showWake('off');
    }
  }
  // iOS releases the lock when you leave the app; re-acquire on return and on any tap.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { tickClock(); tickTrip(); requestLock(); }
  });
  document.addEventListener('touchend', requestLock, { passive: true });
  document.addEventListener('click', requestLock);

  /* ---------- Start ---------- */
  tickClock(); tickTrip(); requestLock();
  setInterval(tickClock, 1000);
  setInterval(tickTrip, 15000);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
